name: Build installers

# Runs the DSP tests, makes the user guide, then builds:
#   macOS   -> dist/EQScope-1.0.0-macOS.pkg         (AU + VST3 + app + guide, universal, macOS 10.13+)
#   Windows -> dist/EQScope-1.0.0-Windows-Setup.exe (VST3 + app + guide, x64)
#   iOS     -> AUv3 + app, unsigned (compile check; installing needs your own signing in Xcode)
# Download the results from the run's Artifacts section on the Actions tab.
#
# Optional macOS signing and notarization: add these repository secrets (Settings -> Secrets -> Actions).
# Without them the .pkg is unsigned.
#   MACOS_CERTS_P12       base64 of a .p12 holding your "Developer ID Application" and "Developer ID Installer" certificates
#   MACOS_CERTS_PASSWORD  password of that .p12
#   APP_CERT              e.g.  Developer ID Application: Your Name (TEAMID)
#   INST_CERT             e.g.  Developer ID Installer: Your Name (TEAMID)
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD   (NOTARY_PASSWORD is an app-specific password)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: DSP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: |
          cmake -B build-tests -DEQSCOPE_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests
          ./build-tests/eqscope_tests

  guide:
    name: User guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the PDF
        run: |
          pip install reportlab pillow
          python docs/make_user_guide.py
      - uses: actions/upload-artifact@v4
        with:
          name: EQScope-User-Guide
          path: docs/EQScope User Guide.pdf

  macos:
    name: macOS installer (AU, VST3, Standalone)
    needs: [tests, guide]
    runs-on: macos-latest
    env:
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
      MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EQScope-User-Guide
          path: docs
      - name: Configure
        run: cmake -B build -G Xcode
      - name: Build
        run: cmake --build build --config Release -- -quiet
      - name: Import signing certificates
        if: env.MACOS_CERTS_P12 != ''
        run: |
          echo "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/certs.p12" -k build.keychain -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          xcrun notarytool store-credentials eqscope-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          echo "NOTARY_PROFILE=eqscope-notary" >> "$GITHUB_ENV"
      - name: Make installer
        env:
          APP_CERT: ${{ secrets.APP_CERT }}
          INST_CERT: ${{ secrets.INST_CERT }}
        run: ./installer/macos/make_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EQScope-macOS-Installer
          path: dist/EQScope-1.0.0-macOS.pkg
      # Checks the AU loads and passes Apple's validator. Runs after the upload, so the installer
      # is always available to download even if the runner's Audio Unit registry is slow to update.
      - name: Validate the AU
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -v aufx Eqpb Hmbx

  windows:
    name: Windows installer (VST3, Standalone)
    needs: [tests, guide]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EQScope-User-Guide
          path: docs
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Make installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "${env:ProgramFiles}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName installer\windows\EQScope.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: EQScope-Windows-Installer
          path: dist/EQScope-1.0.0-Windows-Setup.exe

  ios:
    name: iOS (AUv3 + app, compile check)
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS
      - name: Build (unsigned)
        run: cmake --build build-ios --config Release -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO -quiet
